spring:
  application:
    name: rate-limiter
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rate_limiter}
    username: ${SPRING_DATASOURCE_USERNAME:rate_limiter}
    password: ${SPRING_DATASOURCE_PASSWORD:rate_limiter}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port:

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-change-me}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

#security:
#  jwt:
#    # MUST be at least 32 characters for HS256
##    Y=?%a/BO*!Pi,qQ([(3ZrE[L41jzl-&U+;c6+pJ-Qok
#    secret: ${APP_JWT_SECRET:dev-only-change-me}
#    expiration-minutes: 60


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

rate-limiter:
  global:
    window-seconds: 60
    max-requests: 10000
    monthly-max-requests: 10000000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
